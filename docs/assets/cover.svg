    <pattern id="paper" width="11" height="13" patternUnits="userSpaceOnUse"><path d="M2 3h2M7 10h1" stroke="#927d5c" stroke-opacity=".13"/></pattern>
    <linearGradient id="light" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".06"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="1200" height="420" rx="12" fill="#123e57"/>
  <rect width="1200" height="420" rx="12" fill="url(#linen)"/>
  <rect width="1200" height="420" rx="12" fill="url(#light)"/>
  <path d="M34 34H1166V386H34Z" fill="none" stroke="#d7c399" stroke-opacity=".42"/>
